olf.generatorsDiscardedFromActivePowerControlBecauseTargetPLowerThanMinP = ${impactedGeneratorCount} groupes sont exclus de la participation à la compensation de puissance active car leur consigne de puissance active est inférieure à minP
olf.generatorsDiscardedFromVoltageControlBecauseInconsistentControlledBus = ${impactedGeneratorCount} groupes ont été mis hors réglage de tension car ils étaient connectés à un noeud électrique ou plusieurs groupes réglaient la tension de points différents.
olf.generatorsDiscardedFromVoltageControlBecauseInconsistentTargetVoltages = ${impactedGeneratorCount} groupes ont été mis hors réglage de tension car ils étaient connectés à un noeud électrique ou plusieurs groupes avaient des consignes de tension différentes.
olf.generatorsDiscardedFromVoltageControlBecauseNotStarted = ${impactedGeneratorCount} groupes ont été mis hors réglage de tension car ils n'étaient pas démarrés.
olf.generatorsDiscardedFromVoltageControlBecauseReactiveRangeIsTooSmall = ${impactedGeneratorCount} groupes ont été mis hors réglage de tension car leur plage de réactif est trop faible.
olf.generatorsDiscardedFromVoltageControlBecauseTargetPIsOutsideActiveLimits = ${impactedGeneratorCount} groupes ont été mis hors réglage de tension car leur consigne de puissance active est hors de leur plage de fonctionnement.
olf.generatorsDiscardedFromVoltageControlBecauseTargetVIsImplausible = ${impactedGeneratorCount} groupes ont été mis hors réglage de tension car leur consigne de tension n'est pas plausible.
