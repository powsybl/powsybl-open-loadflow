olf.notUniqueControlledBusDisablingControl = Les groupes [${generatorIds}] sont connectés au même noeud électrique ${controllerBusId} mais règlent la tension de noeuds électriques différents (${controlledBusId} et ${controlledBusGenId}) : désactivation du réglage de tension.
olf.notUniqueControlledBusKeepingFirstControl = Les groupes [${generatorIds}] sont connectés au même noeud électrique ${controllerBusId} mais règlent la tension de noeuds électriques différents : ${controlledBusId} (conservé) et ${controlledBusGenId} (rejeté).
