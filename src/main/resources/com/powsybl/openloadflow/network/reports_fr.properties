olf.notUniqueTargetVControllerBusKeepingFirstControl = Les groupes [${generatorIds}] sont connectés au même noeud électrique ${controllerBusId} avec des tensions de consigne différentes : ${keptTargetV} kV (conservé) et ${rejectedTargetV} kV (rejeté).
olf.oneGeneratorDiscardedFromActivePowerControlBecauseMaxPEqualsMinP = Le groupe ${generatorId} est exclu de la participation à la compensation de puissance active car son maxP (${maxP} MW) est considéré égal à son minP (${minP} MW)
olf.oneGeneratorDiscardedFromActivePowerControlBecauseMaxPNotPlausible = Le groupe ${generatorId} est exclu de la participation à la compensation de puissance active car son maxP (${maxP}MW) est incohérent (supérieur à ${plausibleLimit} MW)
olf.oneGeneratorDiscardedFromActivePowerControlBecauseTargetEqualsToZero = Le groupe ${generatorId} est exclu de la participation à la compensation de puissance active car sa consigne de puissance active (${targetP} MW) est nulle
olf.oneGeneratorDiscardedFromActivePowerControlBecauseTargetPGreaterThanMaxP = Le groupe ${generatorId} est exclu de la participation à la compensation de puissance active car sa consigne de puissance active (${targetP} MW) est supérieure à maxTargetP (${maxTargetP} MW)
olf.oneGeneratorDiscardedFromActivePowerControlBecauseTargetPLowerThanMinP = Le groupe ${generatorId} est exclu de la participation à la compensation de puissance active car sa consigne de puissance active (${targetP} MW) est inférieure à minTargetP (${minTargetP} MW)
olf.oneGeneratorDiscardedFromVoltageControlBecauseImplausibleTargetVoltage = Le groupe ${generatorId} est mis hors réglage de tension car il a une tension de consigne non plausible : ${targetV} p.u
olf.oneGeneratorDiscardedFromVoltageControlBecauseNotStarted = Le groupe ${generatorId} est mis hors réglage de tension car il n'est pas démarré (targetP=${targetP} MW, minP=${minP} MW)
olf.oneGeneratorDiscardedFromVoltageControlBecauseReactiveRangeIsTooSmall = Le groupe ${generatorId} est mis hors réglage de tension car sa plage de réactif est trop faible
olf.oneGeneratorDiscardedFromVoltageControlBecauseTargetPIsOutsideActiveLimits = Le groupe ${generatorId} est mis hors réglage de tension car sa consigne de puissance active est hors de sa plage de fonctionnement (targetP=${targetP} MW, minP=${minP} MW, maxP=${maxP} MW)
olf.rescaledRemoteVoltageControls = ${count} groupes en contrôle de tension distante n'ont pas de consigne équivalente locale et passent en réglage local par mise à l'échelle de la tension nominale locale.
olf.shuntsDiscardedFromVoltageControlBecauseTargetVIsInconsistent = ${impactedShuntCount} moyens de compensation statique ont été mis hors réglage de tension car leur tension de consigne (targetV) est incohérente.
olf.slackBusSelection = Noeud bilan: ${slackBus}
olf.transformerControlAlreadyExistsUpdateDeadband = Les transformateurs ${firstControllerId} et ${newControllerId} règlent la tension sur le noeud électrique ${controlledBusId} avec différentes bandes mortes, la plus fine sera conservée : ${newTargetDeadband}kV (conservée) et ${oldTargetDeadband}kV (rejetée).
olf.transformerControlAlreadyExistsWithDifferentTargetV = Les transformateurs ${firstControllerId} et ${newControllerId} règlent la tension sur le noeud électrique ${controlledBusId} avec des tensions de consigne différentes : ${vcTargetValue}kV (conservée) et ${targetValue}kV (rejetée).
olf.transformersDiscardedFromVoltageControlBecauseTargetVIsInconsistent = ${impactedTransformerCount} transformateurs ont été mis hors réglage de tension car la valeur de tension de consigne (targetV) est incohérente.
olf.voltageInitializer = Initialisation du plan de tension avec la méthode ${initializerName}
